padding-x = 5
padding-y = [3, 3]

env-vars = ["TERM=rio"]

option-as-alt = "left"

[colors]
background = "#282c34"
foreground = "#abb2bf"
cursor = "#abb2bf"
vi-cursor = "#abb2bf"

tabs = "#abb2bf"
tabs-active = "#ffffff"
bar = "#abb2bf"
split = "#abb2bf"

selection-foreground = "#282c34"
selection-background = "#abb2bf"

black = "#1e2127"
blue = "#61afef"
cyan = "#56b6c2"
green = "#98c379"
magenta = "#c678dd"
red = "#e06c75"
white = "#abb2bf"
yellow = "#d19a66"

light-black = "#5c6370"
light-blue = "#61afef"
light-cyan = "#56b6c2"
light-green = "#98c379"
light-magenta = "#c678dd"
light-red = "#e06c75"
light-white = "#ffffff"
light-yellow = "#d19a66"

[fonts]
size = 12

[fonts.regular]
family = "JetBrains Mono"
style = "Medium"

[fonts.bold]
family = "JetBrains Mono"
style = "Bold"

[fonts.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[fonts.italic]
family = "JetBrains Mono"
style = "Medium Italic"

[window]
decorations = "Transparent"
macos-use-shadow = true
